name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - java: '17'
            clojure: '1.11.4'
            timezone: 'UTC'
            language: 'en'
            country: 'US'
          - java: '17'
            clojure: '1.12.6'
            timezone: 'Europe/Istanbul'
            language: 'tr'
            country: 'TR'
          - java: '21'
            clojure: '1.12.6'
            timezone: 'America/New_York'
            language: 'en'
            country: 'US'
          - java: '21'
            clojure: '1.12.6'
            timezone: 'UTC'
            language: 'tr'
            country: 'TR'
          - java: '25'
            clojure: '1.12.6'
            timezone: 'Asia/Tokyo'
            language: 'ja'
            country: 'JP'
    runs-on: ubuntu-24.04
    env:
      JAVA_TOOL_OPTIONS: -Duser.timezone=${{ matrix.timezone }} -Duser.language=${{ matrix.language }} -Duser.country=${{ matrix.country }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: 1.12.5.1664
      - run: clojure -Sdeps '{:deps {org.clojure/clojure {:mvn/version "${{ matrix.clojure }}"}}}' -M:test

  static-and-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: 1.12.5.1664
      - run: clojure -M:lint
      - run: curl -fsSL https://raw.githubusercontent.com/cljdoc/cljdoc/master/script/verify-cljdoc-edn | bash -s doc/cljdoc.edn
      - run: clojure -T:build jar
      - name: Inspect source artifact and POM
        run: |
          jar tf target/calendar-query-0.1.0.jar
          test -s target/classes/META-INF/maven/com.betacalendars/calendar-query/pom.xml
          grep -q '<groupId>com.betacalendars</groupId>' target/classes/META-INF/maven/com.betacalendars/calendar-query/pom.xml
          grep -q '<artifactId>calendar-query</artifactId>' target/classes/META-INF/maven/com.betacalendars/calendar-query/pom.xml
          grep -q '<version>0.1.0</version>' target/classes/META-INF/maven/com.betacalendars/calendar-query/pom.xml
