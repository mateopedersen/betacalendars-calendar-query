name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - java: '17'
            clojure: '1.11.4'
            timezone: 'UTC'
            language: 'en'
            country: 'US'
          - java: '17'
            clojure: '1.12.6'
            timezone: 'Europe/Istanbul'
            language: 'tr'
            country: 'TR'
          - java: '21'
            clojure: '1.12.6'
            timezone: 'America/New_York'
            language: 'en'
            country: 'US'
          - java: '21'
            clojure: '1.12.6'
            timezone: 'UTC'
            language: 'tr'
            country: 'TR'
          - java: '25'
            clojure: '1.12.6'
            timezone: 'Asia/Tokyo'
            language: 'ja'
            country: 'JP'
    runs-on: ubuntu-24.04
    env:
      JAVA_TOOL_OPTIONS: -Duser.timezone=${{ matrix.timezone }} -Duser.language=${{ matrix.language }} -Duser.country=${{ matrix.country }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: 1.12.5.1664
      - run: clojure -Sdeps '{:deps {org.clojure/clojure {:mvn/version "${{ matrix.clojure }}"}}}' -M:test

  static-and-package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@13.6.1
        with:
          cli: 1.12.5.1664
      - run: clojure -Stree
      - run: clojure -M:lint
      - run: curl -fsSL https://raw.githubusercontent.com/cljdoc/cljdoc/master/script/verify-cljdoc-edn | bash -s doc/cljdoc.edn
      - run: clojure -T:build jar
      - name: Inspect source artifact and POM
        run: |
          jar tf target/calendar-query-0.1.0.jar
          jar tf target/calendar-query-0.1.0.jar | grep -q '^betacalendars/calendar_query.clj$'
          jar tf target/calendar-query-0.1.0.jar | grep -q '^betacalendars/calendar_query/date.clj$'
          if jar tf target/calendar-query-0.1.0.jar | grep -Eq '^(test|bench)/'; then exit 1; fi
          test "$(stat -c%s target/calendar-query-0.1.0.jar)" -gt 0
          test -s target/classes/META-INF/maven/net.clojars.mateopedersen/calendar-query/pom.xml
          POM=target/classes/META-INF/maven/net.clojars.mateopedersen/calendar-query/pom.xml
          grep -q '<groupId>net.clojars.mateopedersen</groupId>' "$POM"
          grep -q '<artifactId>calendar-query</artifactId>' "$POM"
          grep -q '<version>0.1.0</version>' "$POM"
          grep -q '<name>BetaCalendars Calendar Query</name>' "$POM"
          grep -q '<description>Declarative, composable calendar data queries for Clojure</description>' "$POM"
          grep -q '<url>https://www.betacalendars.com/</url>' "$POM"
          grep -q '<name>MIT License</name>' "$POM"
          grep -q '<tag>v0.1.0</tag>' "$POM"
          grep -q 'github.com/mateopedersen/betacalendars-calendar-query' "$POM"
          grep -q '<artifactId>clojure</artifactId>' "$POM"
          if grep -q 'SNAPSHOT' "$POM"; then exit 1; fi
